name: Setup integrated Qt and Manifesto toolchain
description: Install pinned Qt tooling and build the reviewed Manifesto revision.
inputs:
  manifesto-repository:
    description: Repository containing the ecosystem tool.
    required: true
  manifesto-ref:
    description: Immutable ecosystem commit.
    required: true
  build-parallelism:
    description: Parallelism used to build the ecosystem tool.
    required: false
    default: '2'
  install-docs:
    description: Install documentation packages from the signed OS repository.
    required: false
    default: 'false'
  sphinx-theme-package:
    description: Retained for generated-workflow compatibility.
    required: false
    default: 'sphinx-rtd-theme'
outputs:
  manifesto-source-root:
    description: Checked-out ecosystem source tree.
    value: ${{ steps.paths.outputs.manifesto-source-root }}
  manifesto-build-root:
    description: Ecosystem build tree.
    value: ${{ steps.paths.outputs.manifesto-build-root }}
  manifesto-binary:
    description: Built Manifesto executable.
    value: ${{ steps.paths.outputs.manifesto-binary }}
runs:
  using: composite
  steps:
    - name: Set toolchain paths
      id: paths
      shell: bash
      run: |
        echo "manifesto-source-root=.ecosystem/tooling/cppr/ecosystem" >> "$GITHUB_OUTPUT"
        echo "manifesto-bootstrap-root=.ecosystem/tooling/build/debug" >> "$GITHUB_OUTPUT"
        echo "manifesto-build-root=.ecosystem/tooling/build/debug" >> "$GITHUB_OUTPUT"
        echo "manifesto-binary=.ecosystem/tooling/build/debug/manifesto" >> "$GITHUB_OUTPUT"
    - name: Checkout reviewed ecosystem revision
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: ${{ inputs.manifesto-repository }}
        ref: ${{ inputs.manifesto-ref }}
        path: .ecosystem/tooling/cppr
        sparse-checkout: |
          ecosystem
        sparse-checkout-cone-mode: false
    - name: Install pinned Qt
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
      with:
        version: '6.8.3'
        target: desktop
        modules: qtsvg
        install-deps: 'true'
        cache: 'true'
        aqtversion: '==3.1.21'
        py7zrversion: '==0.22.0'
    - name: Install native build dependencies
      shell: bash
      run: |
        packages=(
          clang
          clang-format
          clang-tidy
          cmake
          ninja-build
          libclang-dev
          default-jdk
        )
        if [ "${{ inputs.install-docs }}" = "true" ]; then
          packages+=(
            graphviz
            python3-sphinx
            python3-myst-parser
            python3-sphinx-rtd-theme
          )
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
    - name: Record resolved dependency versions
      shell: bash
      run: |
        report_root=".ecosystem/github/reports/00-toolchain"
        mkdir -p "$report_root"
        {
          cmake --version | head -n 1
          clang++ --version | head -n 1
          qmake -query QT_VERSION
          printf 'manifesto commit %s\n' '${{ inputs.manifesto-ref }}'
        } > "$report_root/versions.txt"
    - name: Build ecosystem tool
      shell: bash
      env:
        CC: clang
        CXX: clang++
      run: |
        cmake \
          -S "${{ steps.paths.outputs.manifesto-source-root }}" \
          -B "${{ steps.paths.outputs.manifesto-bootstrap-root }}" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DECOSYSTEM_BUILD_TESTS=OFF
        cmake --build \
          "${{ steps.paths.outputs.manifesto-bootstrap-root }}" \
          --parallel "${{ inputs.build-parallelism }}"
